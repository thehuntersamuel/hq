<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V1 Desk Control</title><style>
:root{--bg:#07090a;--panel:#0d1215;--line:#1d2a30;--ink:#edf4f6;--mut:#74868e;--cyan:#42b7d6;--green:#5bc985;--amber:#e0b454;--red:#ee6c63}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#10191d,transparent 35%),var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1320px;margin:auto;padding:22px}.top{display:flex;gap:15px;align-items:flex-end;border-bottom:2px solid var(--cyan);padding:8px 0 17px}.top h1{margin:0;font-size:28px;font-style:italic;letter-spacing:.06em}.tag{border:1px solid var(--cyan);color:var(--cyan);font:10px monospace;letter-spacing:.18em;padding:5px 8px}.stamp{margin-left:auto;text-align:right;color:var(--mut);font:10px monospace;line-height:1.7}.tabs,.links{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.tab,.link,.refresh{appearance:none;background:#0a0e10;color:#8fa1a9;border:1px solid var(--line);padding:9px 12px;font:10px monospace;letter-spacing:.12em;cursor:pointer;text-decoration:none}.tab.on{border-color:var(--cyan);color:white;box-shadow:inset 0 -2px var(--cyan)}.link:hover,.tab:hover,.refresh:hover{border-color:var(--cyan);color:white}.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.health{font:10px monospace;letter-spacing:.12em}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.flash{color:var(--cyan)}.hero{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:14px}.kpi{padding:15px;border-right:1px solid var(--line);min-width:0}.kpi:last-child{border:0}.k{color:var(--mut);font:9px monospace;letter-spacing:.16em;text-transform:uppercase}.v{font-size:25px;margin-top:5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.n{color:#8ca0a8;font-size:10px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:linear-gradient(180deg,#0d1215,#090c0e);border:1px solid var(--line);padding:16px;min-width:0}.wide{grid-column:1/-1}.card h2{font-size:11px;font-style:italic;letter-spacing:.15em;margin:0 0 12px}.rows{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #162126;padding:7px 0}.row span:first-child{color:#8fa2aa}.row b{text-align:right;font-variant-numeric:tabular-nums}.pill{display:inline-block;padding:3px 6px;border:1px solid var(--line);font:9px monospace;letter-spacing:.08em}.pill.good{border-color:#285b3d}.pill.warn{border-color:#6d5528}.pill.bad{border-color:#702e2a}.note{color:#9aacb3;font-size:11px;line-height:1.65}.tiny{font:9px monospace;color:var(--mut)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px 8px;border-bottom:1px solid #162126;text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{font:9px monospace;color:var(--mut);letter-spacing:.1em}.left{text-align:left!important}.scroll{max-height:500px;overflow:auto}.issue{border-left:3px solid var(--line);padding:9px 11px;margin:8px 0;background:#090d0f}.issue.bad{border-left-color:var(--red);color:var(--ink)}.issue.warn{border-left-color:var(--amber);color:var(--ink)}.issue.good{border-left-color:var(--green);color:var(--ink)}.issue b{display:block;margin-bottom:3px}.error{border:1px solid #702e2a;color:var(--red);padding:18px}@media(max-width:800px){.wrap{padding:13px}.top{align-items:flex-start;flex-wrap:wrap}.stamp{margin:0;width:100%;text-align:left}.hero{grid-template-columns:1fr 1fr}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.rows{grid-template-columns:1fr}.card{overflow:auto}.v{font-size:21px}table{min-width:620px}}
</style></head><body><div class="wrap"><div class="top"><h1>V1 DESK CONTROL</h1><span class="tag">LIVE</span><div class="stamp" id="stamp">CLOSED-V1 OPERATING DESKS<br>60 SECOND POLL</div></div><div class="tabs" id="tabs"></div><div class="bar"><button class="refresh" id="refresh">REFRESH NOW</button><span class="health" id="health">LOADING</span><span class="tiny" id="last"></span></div><div id="app"></div></div><script>
const TOKEN=new URLSearchParams(location.search).get('t')||'';const API='https://mojjazwjwksypjtljusz.supabase.co/functions/v1/v1-desk-control';const DESKS=['cash','quinn','hawke','ruby','iris','rio'];let desk=(new URLSearchParams(location.search).get('desk')||'cash').toLowerCase();if(!DESKS.includes(desk))desk='cash';let sig=null,lastGood=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>v==null?'—':Number(v).toLocaleString('en-US'),money=v=>v==null?'—':Number(v).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}),pct=v=>v==null?'—':Number(v).toFixed(1)+'%',age=t=>{if(!t)return'—';let h=(Date.now()-new Date(t).getTime())/36e5;return h<1?Math.round(h*60)+'m':h<48?h.toFixed(1)+'h':(h/24).toFixed(1)+'d'};function pill(s){s=String(s??'UNKNOWN');let c=/fresh|sent|complete|completed|approved|ok|resolved|live/i.test(s)?'good':/stale|silent|fail|disapproved|critical|blocked|never/i.test(s)?'bad':'warn';return `<span class="pill ${c}">${esc(s)}</span>`}function row(k,v){return `<div class="row"><span>${esc(k)}</span><b>${v}</b></div>`}function hero(a){return `<div class="hero">${a.map(x=>`<div class="kpi"><div class="k">${esc(x[0])}</div><div class="v">${x[1]}</div><div class="n">${x[2]||''}</div></div>`).join('')}</div>`}function card(t,b,w=''){return `<div class="card ${w}"><h2>${esc(t)}</h2>${b}</div>`}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function renderCash(d){let s=d.scoreboard||{},r=d.recent||[],cov=d.coverage||[];return hero([['POs THIS MONTH',num(s.month),'live history starts Aug 10'],['SENT',num(s.sent),s.unsent_drafts===0?'outbox clear':'unsent exist'],['WAITING ON HUNTER',num(s.waiting_on_hunter),s.waiting_on_hunter?'needs input':'clear'],['DRAFT CHECK',age(s.draft_check_ran),s.unsent_drafts?num(s.unsent_drafts)+' unsent':'no unsent drafts']])+`<div class="grid">${card('PIPELINE HEALTH',`<div class="rows">${row('Today',num(s.today))}${row('Last 7 days',num(s.last_7))}${row('Unsent drafts',num(s.unsent_drafts))}${row('Oldest unsent',s.oldest_unsent_h==null?'—':s.oldest_unsent_h+'h')}${row('Katool',num(s.by_brand?.katool||0))}${row('Triumph',num(s.by_brand?.triumph||0))}</div><p class="note">Drafted is not terminal. A PO counts sent only when the Gmail outbox watcher stamps sent_at.</p>`)}${card('RECENT PO COVERAGE',table(['ORDER','PO','BRAND','CREATED','COVERAGE'],cov.slice(0,18).map(x=>`<tr><td>${esc(x.order)}</td><td>${esc(x.po)}</td><td>${esc(x.po_brand)}</td><td>${age(x.po_created_at)} ago</td><td class="left">${esc((x.covers||[]).map(y=>(y.qty||1)+'× '+(y.sku||y.item)).join(', '))}</td></tr>`)),'wide')}${card('RECENT WORKER ROWS',table(['ORDER','BRAND','STATE','CREATED','SENT'],r.slice(0,20).map(x=>`<tr><td>${esc(x.order_name)}</td><td>${esc(x.brand)}</td><td>${pill(x.sent_at?'sent':x.status)}</td><td>${age(x.created_at)} ago</td><td>${x.sent_at?age(x.sent_at)+' ago':'—'}</td></tr>`)),'wide')}</div>`}
function renderQuinn(d){let s=d.scoreboard||{},p=d.close_rate?.periods||{},m=p.month||{},w=p.last_7||{},a=d.active_pipeline||[],b=d.age_buckets||{};let activeValue=a.reduce((t,x)=>t+Number(x.total||0),0);return hero([['QUOTES OUT · MONTH',num(m.quotes_out),money(m.quoted_value)+' quoted'],['COHORT CLOSE',pct(m.cohort_close_pct),num(m.won)+' won'],['WON VALUE',money(m.won_value),'this month'],['ACTIVE <30D',num(a.length),money(activeValue)+' open']])+`<div class="grid">${card('AGE OF ACTIVE PIPELINE',`<div class="rows">${row('0–2 days',num(b.d0_2))}${row('3–7 days',num(b.d3_7))}${row('8–14 days',num(b.d8_14))}${row('15–29 days',num(b.d15_29))}${row('Median close time',s.median_days_to_close+'d')}${row('Last 7d cohort close',pct(w.cohort_close_pct))}</div><p class="note">30+ day open quotes are excluded from active pipeline by the standing 30-day rule unless the customer gave a purchase timeframe.</p>`)}${card('LAST 7 DAYS',`<div class="rows">${row('Quotes out',num(w.quotes_out))}${row('Quoted value',money(w.quoted_value))}${row('Won',num(w.won))}${row('Won value',money(w.won_value))}${row('Instant orders',num(w.instant_orders))}${row('Instant value',money(w.instant_value))}</div>`)}${card('ACTIVE QUOTES · <30 DAYS',table(['DRAFT','CUSTOMER','STATE','VALUE','AGE','UPDATED'],a.slice(0,35).map(x=>`<tr><td>${esc(x.name)}</td><td class="left">${esc(x.customer_name||x.email||'—')}</td><td>${pill(x.status)}</td><td>${money(x.total)}</td><td>${age(x.created_at)}</td><td>${age(x.updated_at)} ago</td></tr>`)),'wide')}</div>`}
function renderHawke(d){let s=d.scoreboard||{},w=d.week||{},r=d.recent||[];let gp=w.leads?100*w.gclid/w.leads:null,crm=w.leads?100*w.crm_linked/w.leads:null;return hero([['LEADS · 7D',num(w.leads),'history is young'],['GCLID CAPTURE',gp==null?'—':pct(gp),num(w.gclid)+' with click id'],['CRM LINKED',crm==null?'—':pct(crm),num(w.crm_linked)+' linked'],['TEXTABLE',num(s.textable),num(s.total)+' total captured']])+`<div class="grid">${card('INTAKE COMPLETENESS',`<div class="rows">${row('With email',num(s.with_email))}${row('With phone',num(s.with_phone))}${row('With product',num(s.with_product))}${row('Pickup',num(s.pickup))}${row('Delivery',num(s.delivery))}${row('Newest lead',age(s.newest)+' ago')}</div><p class="note">Hawke owns capture and handoff. Low historical totals before the writer existed are missing coverage, not low demand.</p>`)}${card('FORM MIX · LAST 7D',Object.entries(w.by_form||{}).map(([k,v])=>row(k,num(v))).join('')||'<p class="note">No form rows.</p>')}${card('RECENT LEADS',table(['NAME','FORM','PRODUCT','GCLID','CRM','AGE'],r.slice(0,30).map(x=>`<tr><td class="left">${esc(x.name)}</td><td>${esc(x.form_type||'—')}</td><td class="left">${esc(x.product||'—')}</td><td>${x.gclid?pill('yes'):pill('no')}</td><td>${x.crm_contact_id?pill('linked'):pill('unlinked')}</td><td>${age(x.created_at)}</td></tr>`)),'wide')}</div>`}
function renderRuby(d){let s=d.scoreboard||{},life=s.lifetime||{},u=d.unanswered||[],c=d.consults||[],p=d.proposals||[],m=d.messages_7d||{},ch=s.chase_list?.yours||[];let pendingC=c.filter(x=>x.status==='pending'),pendingP=p.filter(x=>x.status==='pending');return hero([['UNANSWERED',num(u.length),u.length?'customer waiting':'clear'],['PENDING CONSULTS',num(pendingC.length),'Hunter truth requests'],['PENDING PROPOSALS',num(pendingP.length),'approval-gated'],['RETENTION READY',num(s.yours_now),money(s.yours_value)+' eligible']])+`<div class="grid">${card('CRM ACTIVITY · 7D',`<div class="rows">${row('Inbound',num(m.inbound))}${row('Outbound',num(m.outbound))}${row('Repeat customers',num(life.repeat_customers))}${row('Repeat rate',life.repeat_pct==null?'—':life.repeat_pct+'%')}${row('Avg repeat value',money(life.avg_value_repeat_customer))}${row('Avg single value',money(life.avg_value_single_customer))}</div>`)}${card('HOLDS / READINESS',`<div class="rows">${row('Part-open',num(s.held_part_open))}${row('In transit',num(s.held_in_transit))}${row('Ready for pickup',num(s.held_ready_for_pickup))}${row('Unknown fulfillment',num(s.held_unknown))}${row('Pickup ready',num(s.yours_by_method?.pickup||0))}${row('Delivery ready',num(s.yours_by_method?.delivery||0))}</div>`)}${card('CUSTOMERS WAITING',u.length?u.map(x=>`<div class="issue warn"><b>${esc(x.name||x.phone)}</b><span class="note">${esc(x.they_said)} · waiting ${Number(x.waiting_hours||0).toFixed(1)}h</span></div>`).join(''):'<div class="issue good"><b>Clear</b><span class="note">No unanswered customer turns.</span></div>')}${card('CONSULTS / APPROVALS',`${pendingC.map(x=>`<div class="issue warn"><b>${esc(x.kind)} · ${esc(x.sku||'')}</b><span class="note">${esc(x.question)}</span></div>`).join('')||'<div class="note">No pending Hunter consults.</div>'}${pendingP.map(x=>`<div class="issue warn"><b>${esc(x.action_type)} · ${esc(x.target)}</b><span class="note">${esc(x.reasoning)}</span></div>`).join('')||''}`)}${card('RETENTION CHASE LIST',table(['CUSTOMER','ORDER','VALUE','METHOD','DAYS','CONF'],ch.slice(0,18).map(x=>`<tr><td class="left">${esc(x.customer)}</td><td>${esc(x.order)}</td><td>${money(x.spent)}</td><td>${esc(x.how)}</td><td>${num(x.days_since)}</td><td>${esc(x.confidence)}</td></tr>`)),'wide')}</div>`}
function renderIris(d){let s=d.scoreboard||{},h=d.feed_health||{},feeds=h.feeds||[],recent=h.recent||[],cat=d.catalog||{};let silent=feeds.filter(x=>String(x.state).toLowerCase()==='silent').length,issueFeeds=feeds.filter(x=>Number(x.disapproved||0)>0||Number(x.with_issues||0)>0||x.blocked_on).length;return hero([['FEEDS WATCHED',num(s.feeds_watched),num(s.feeds_fresh)+' fresh'],['SILENT',num(silent),silent?'needs attention':'none'],['DISAPPROVED',num(s.disapproved),'Merchant items'],['NEVER FORWARDED',num(s.never_forwarded?.products),money(s.never_forwarded?.value)+' at risk']])+`<div class="grid">${card('CATALOG COVERAGE',`<div class="rows">${row('Products mirrored',num(cat.products))}${row('Product facts',num(cat.facts))}${row('Feeds with issues',num(issueFeeds))}${row('Feed events · 7d',num(Object.values(h.counts_7d||{}).reduce((a,b)=>Number(a)+Number(b),0)))}</div><p class="note">Iris reports delivery/health truth. Search Console performance interpretation belongs to Lyric; paid-media economics belong to Rome.</p>`)}${card('7-DAY FEED CHANGES',Object.entries(h.counts_7d||{}).map(([k,v])=>row(k,num(v))).join(''))}${card('FEED HEALTH',table(['FEED','STATE','ITEMS','ISSUES','LAST RUN'],feeds.map(x=>`<tr><td class="left">${esc(x.feed)}</td><td>${pill(x.state)}</td><td>${num(x.items)}</td><td>${num(x.disapproved??x.with_issues)}</td><td>${age(x.last_run)} ago</td></tr>`)),'wide')}${card('RECENT CHANGES',table(['WHEN','FEED','CHANGE','SKU','TITLE'],recent.slice(0,28).map(x=>`<tr><td>${age(x.at)} ago</td><td class="left">${esc(x.feed)}</td><td>${pill(x.what)}</td><td>${esc(x.sku||'—')}</td><td class="left">${esc(x.title||'—')}</td></tr>`)),'wide')}</div>`}
function renderRio(d){let s=d.scoreboard||{},b=d.briefing||{},e=d.escalations||[],open=e.filter(x=>!x.resolved_at),resolved=e.filter(x=>x.resolved_at),pending=d.pending_proposals||[];let byDesk={};open.forEach(x=>byDesk[x.from_desk]=(byDesk[x.from_desk]||0)+1);return hero([['OPEN ESCALATIONS',num(b.still_open_total??open.length),'full unresolved queue'],['NEW',num(b.new_since_last_time),'since last briefing'],['WAITING ON YOU',num((b.still_waiting_on_you||[]).length),'needs Hunter truth'],['PENDING PROPOSALS',num(pending.length),'floor-wide approvals']])+`<div class="grid">${card('OPEN BY SOURCE DESK',Object.entries(byDesk).map(([k,v])=>row(k,num(v))).join('')||'<div class="note">No open escalations.</div>')}${card('RIO RULE',`<p class="note">Other desks file here instead of interrupting Hunter. Repeated asks are the priority signal; resolved truth belongs back in the owning desk's permanent store.</p>${row('Times asked total',num(s.times_asked))}${row('Desks live',num(s.desks_with_live_numbers))}`)}${card('WAITING ON HUNTER',(b.still_waiting_on_you||[]).length?(b.still_waiting_on_you||[]).map(x=>`<div class="issue warn"><b>#${x.id} · ${esc(x.owner_desk)}</b><span class="note">${esc(x.what)} · ${x.waiting_days}d waiting · asked ${x.asked_times}×</span></div>`).join(''):'<div class="issue good"><b>Clear</b><span class="note">No listed Hunter-truth items.</span></div>')}${card('OPEN ESCALATIONS',table(['ID','FROM','KIND','SUBJECT','ASKS','AGE'],open.slice(0,35).map(x=>`<tr><td>${x.id}</td><td>${esc(x.from_desk)}</td><td>${esc(x.kind)}</td><td class="left">${esc(x.subject)}</td><td>${num(x.times_seen)}</td><td>${age(x.first_seen)}</td></tr>`)),'wide')}${card('RECENTLY RESOLVED',table(['ID','FROM','SUBJECT','RESOLVED'],resolved.slice(0,20).map(x=>`<tr><td>${x.id}</td><td>${esc(x.from_desk)}</td><td class="left">${esc(x.subject)}</td><td>${age(x.resolved_at)} ago</td></tr>`)),'wide')}</div>`}
function render(d){return desk==='cash'?renderCash(d):desk==='quinn'?renderQuinn(d):desk==='hawke'?renderHawke(d):desk==='ruby'?renderRuby(d):desk==='iris'?renderIris(d):renderRio(d)}function nav(){let names={cash:'CASH · PO',quinn:'QUINN · QUOTES',hawke:'HAWKE · LEADS',ruby:'RUBY · CRM',iris:'IRIS · FEEDS',rio:'RIO · BENCH'};$('#tabs').innerHTML=DESKS.map(x=>`<button class="tab ${x===desk?'on':''}" data-d="${x}">${names[x]}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{desk=b.dataset.d;let u=new URL(location.href);u.searchParams.set('desk',desk);history.replaceState(null,'',u);nav();load(true)})}async function load(){if(!TOKEN){$('#app').innerHTML='<div class="error">Missing HQ key.</div>';return}$('#health').textContent='REFRESHING';$('#health').className='health warn';try{let r=await fetch(`${API}?t=${encodeURIComponent(TOKEN)}&desk=${desk}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);let d=await r.json();let changed=sig!==null&&sig!==d.signature;sig=d.signature;lastGood=d;$('#app').innerHTML=render(d);$('#last').textContent=`SERVER ${new Date(d.server_time).toLocaleTimeString()} · AUTO ${d.auto_refresh_seconds}s`;$('#health').textContent=changed?'DATA CHANGED':'LIVE';$('#health').className='health '+(changed?'flash':'good');$('#stamp').innerHTML=`${desk.toUpperCase()} CONTROL ROOM<br>${new Date(d.server_time).toLocaleString()}`;if(changed)setTimeout(()=>{if($('#health').textContent==='DATA CHANGED'){$('#health').textContent='LIVE';$('#health').className='health good'}},3500)}catch(e){$('#health').textContent='REFRESH FAILED';$('#health').className='health bad';if(!lastGood)$('#app').innerHTML=`<div class="error">Could not load ${esc(desk)} control room: ${esc(e.message)}. Nothing stale is substituted.</div>`;else $('#last').textContent=`LAST GOOD SNAPSHOT REMAINS VISIBLE · ${esc(e.message)}`}}$('#refresh').onclick=load;nav();load();setInterval(()=>{if(!document.hidden)load()},60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('focus',load);
</script></body></html>
