<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Pitstop Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D10; --panel:#10151A; --line:#1E262D;
    --ink:#F2F5F7; --ink2:#9FADB6; --ink3:#5F6C75;
    --blue:#00A1CF; --blue2:#1CA5DB; --blue3:#4FC1E9;
    --alert:#E06C5B; --ok:#2FBF71;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;
    gap:14px;padding:16px 22px;pointer-events:none}
  header .wm{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;
    letter-spacing:.24em;color:var(--ink)}
  header .wm b{color:var(--blue2);font-weight:600}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;
    color:var(--ink3);pointer-events:auto}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--alert)}

  #stage{position:fixed;inset:0}
  svg{width:100%;height:100%;display:block}

  .nd{cursor:pointer}
  .nd circle.body{transition:r .5s cubic-bezier(.22,.8,.36,1), fill .3s, stroke .3s, filter .3s}
  .nd:hover circle.body{filter:drop-shadow(0 0 9px currentColor)}
  .nd text{pointer-events:none;user-select:none}
  .nm{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;fill:var(--ink)}
  .rl{fill:var(--ink2);font-size:10.5px;font-family:'Inter',sans-serif}
  .nt{fill:var(--ink2);font-size:11px;font-family:'Inter',sans-serif}
  .g-node{transition:transform .55s cubic-bezier(.22,.8,.36,1), opacity .45s}
  .spoke,.xlink{transition:opacity .45s}
  .xlink{stroke-dasharray:3 5}

  @keyframes pulse{0%{transform:scale(1);opacity:.5}70%{transform:scale(1.4);opacity:0}100%{transform:scale(1.4);opacity:0}}
  .halo,.halo2{transform-origin:center;transform-box:fill-box;animation:pulse 3.4s ease-out infinite}
  .halo2{animation-delay:1.15s}
  .speaking .halo{animation-duration:.85s}
  .speaking .halo2{animation-duration:.85s;animation-delay:.28s}

  .hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:12px;
    color:var(--ink3);pointer-events:none;transition:opacity .4s}
  .ctl{position:fixed;bottom:16px;right:18px;z-index:10}
  .ctl button{background:var(--panel);border:1px solid var(--line);color:var(--ink2);
    font:11px 'Inter',sans-serif;letter-spacing:.05em;padding:8px 13px;border-radius:20px;
    cursor:pointer;transition:all .2s}
  .ctl button:hover,.ctl button:focus-visible{color:var(--ink);border-color:var(--blue);outline:none}
  .ctl button.on{background:var(--blue);border-color:var(--blue);color:#04222C;font-weight:600}
  .crumb{position:fixed;bottom:16px;left:18px;z-index:10;font-size:11.5px;
    transition:opacity .4s}
  .crumb a{color:var(--ink2);text-decoration:none;cursor:pointer}
  .crumb a:hover{color:var(--blue3)}
</style>
</head>
<body>
<header>
  <span class="wm">PITSTOP <b>BRAIN</b></span>
  <span class="status"><span class="dot" id="hubdot"></span><span id="hubtxt"></span></span>
</header>

<div id="stage"><svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg></div>

<div class="hint" id="hint">click a name to open their branch</div>
<div class="crumb" id="crumb" style="opacity:0"><a id="backlink">&larr; back to the floor</a></div>
<div class="ctl"><button id="xbtn" style="display:none">show connections</button></div>

<script>
const REPO = "https://github.com/thehuntersamuel/pitstop-pro-brain/blob/main/";
const BRAIN_FN = "https://mojjazwjwksypjtljusz.supabase.co/functions/v1/brain";
const HQ_FN = "https://mojjazwjwksypjtljusz.supabase.co/functions/v1/hq";
const TOKEN = new URLSearchParams(location.search).get("t") || "";

const OFFICES = [
  {dir:"00-HQ", emp:"Maddox", role:"chief of staff", color:"#00A1CF"},
  {dir:"10-Duke-PO-Desk", emp:"Duke", role:"purchase orders", color:"#6C8EF5"},
  {dir:"20-Piper-Quote-Desk", emp:"Piper", role:"quotes", color:"#3FBF8F"},
  {dir:"30-Scout-Lead-Watch", emp:"Scout", role:"lead watch", color:"#E06C5B"},
  {dir:"40-Ledger-Books", emp:"Ledger", role:"the books", color:"#9B7EDE"},
  {dir:"50-Click-Ads", emp:"Click", role:"paid ads", color:"#E8B23A"},
  {dir:"60-Merch-Feeds", emp:"Merch", role:"feeds", color:"#2FA3A8"},
  {dir:"70-Scribe-SEO", emp:"Scribe", role:"seo + content", color:"#C77BB8"},
  {dir:"80-Keeper-CRM", emp:"Keeper", role:"crm + retention", color:"#8CB85C"},
  {dir:"90-RnD", emp:"RnD", role:"r&d bench", color:"#8A94A0"},
];
const byEmp = {}; OFFICES.forEach(o=>byEmp[o.emp]=o);
const byDir = {}; OFFICES.forEach(o=>byDir[o.dir]=o);

let GRAPH = {nodes:[], links:[]};
let mode = "home", focusEmp = null, showX = false, statsCache = null;
const CX = 600, CY = 410;
const svg = document.getElementById("scene");
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); (parent||svg).appendChild(e); return e; }
function pretty(s){ s = s.replace(/_/g," ").replace(/\d{4} \d{2} \d{2}/g,"").trim();
  return s.length > 26 ? s.slice(0,24)+"…" : s; }

const gSpokes = el("g", {id:"spokes"});
const gX = el("g", {id:"xlinks"});
const gNodes = el("g", {id:"nodes"});
const nodeEls = {};

function makeNode(id, kind){
  const g = el("g", {class:"g-node nd"}, gNodes);
  g.addEventListener("click", ev=>{ ev.stopPropagation(); onClick(id, kind); });
  const parts = {g, kind};
  if (kind === "center"){
    parts.halo = el("circle", {class:"halo", r:64, fill:"none", stroke:"#00A1CF", "stroke-width":2, cx:0, cy:0}, g);
    parts.halo2 = el("circle", {class:"halo2", r:64, fill:"none", stroke:"#00A1CF", "stroke-width":1.2, cx:0, cy:0}, g);
  }
  parts.body = el("circle", {class:"body", cx:0, cy:0}, g);
  parts.name = el("text", {class:"nm", "text-anchor":"middle"}, g);
  parts.role = el("text", {class:"rl", "text-anchor":"middle"}, g);
  nodeEls[id] = parts;
  return parts;
}
function place(id, x, y, o){
  const p = nodeEls[id]; if(!p) return;
  p.g.style.transform = `translate(${x}px, ${y}px)`;
  p.g.style.opacity = o.op ?? 1;
  p.g.style.pointerEvents = (o.op ?? 1) < 0.3 ? "none" : "auto";
  p.g.style.color = o.stroke || "#1E262D";
  p.body.setAttribute("r", o.r);
  p.body.setAttribute("fill", o.fill || "#10151A");
  p.body.setAttribute("stroke", o.stroke || "#1E262D");
  p.body.setAttribute("stroke-width", o.sw || 1.5);
  if (p.halo){ p.halo.setAttribute("r", o.r); p.halo2.setAttribute("r", o.r); }
  p.name.textContent = o.name || "";
  p.name.setAttribute("y", o.nameIn ? 6 : o.r + 21);
  p.name.setAttribute("font-size", o.ns || 13);
  if (p.role){ p.role.textContent = o.role || "";
    p.role.setAttribute("y", (o.nameIn ? 6 : o.r + 21) + 15);
    p.role.setAttribute("class", o.noteLabel ? "nt" : "rl"); }
  p._pos = {x, y};
}
function spoke(x1,y1,x2,y2,color,op,cls){
  return el("line", {x1,y1,x2,y2, class:cls||"spoke", stroke:color||"#1E262D",
    "stroke-width":1, style:`opacity:${op}`}, cls==="xlink" ? gX : gSpokes);
}
function clearLines(){ gSpokes.innerHTML=""; gX.innerHTML=""; }

const notesOf = dir => GRAPH.nodes.filter(n=>n.office===dir && n.kind==="note");
const nodeById = id => GRAPH.nodes.find(n=>n.id===id);

/* ---------- HOME: Maddox center, staff ring ---------- */
function layoutHome(){
  mode = "home"; focusEmp = null; clearLines(); clearOps();
  document.getElementById("hint").style.opacity = 1;
  document.getElementById("crumb").style.opacity = 0;
  document.getElementById("xbtn").style.display = "none";
  const emps = OFFICES.filter(o=>o.emp!=="Maddox");
  emps.forEach((o,i)=>{
    const a = -Math.PI/2 + i*(2*Math.PI/emps.length);
    const x = CX + Math.cos(a)*318, y = CY + Math.sin(a)*242;
    spoke(CX, CY, x, y, "#1E262D", 1);
    place(o.emp, x, y, {r:34, stroke:o.color, sw:2, name:o.emp, role:o.role, ns:14});
  });
  GRAPH.nodes.filter(n=>n.kind==="note").forEach(n=>{
    const o = byDir[n.office]; const p = nodeEls[o.emp]?._pos || {x:CX,y:CY};
    place(n.id, p.x, p.y, {r:6, op:0});
  });
  place("Maddox", CX, CY, {r:64, fill:"#0B2531", stroke:"#00A1CF", sw:2.5,
    name:"MADDOX", nameIn:true, ns:20});
}

/* ---------- FOCUS: one branch only ---------- */
function layoutFocus(emp){
  mode = "focus"; focusEmp = emp; clearLines(); clearOps();
  const o = byEmp[emp];
  document.getElementById("hint").style.opacity = 0;
  document.getElementById("crumb").style.opacity = 1;
  const notes = notesOf(o.dir);
  const xbtn = document.getElementById("xbtn");
  xbtn.style.display = crossRefs(o).length ? "block" : "none";
  xbtn.classList.toggle("on", showX);
  xbtn.textContent = showX ? "hide connections" : "show connections";

  place(emp, CX, CY, {r:58, fill:"#0B2531", stroke:o.color, sw:2.5,
    name:emp.toUpperCase(), nameIn:true, ns:18});
  const R = 218;
  notes.forEach((n,i)=>{
    const a = -Math.PI/2 + i*(2*Math.PI/Math.max(notes.length,3));
    const x = CX + Math.cos(a)*R, y = CY + Math.sin(a)*R*0.8;
    spoke(CX, CY, x, y, o.color, .3);
    place(n.id, x, y, {r:24, stroke:o.color, sw:1.5, role:pretty(n.id), noteLabel:true});
  });
  OFFICES.filter(q=>q.emp!==emp && q.emp!=="Maddox").forEach((q,i,arr)=>{
    const a = -Math.PI/2 + i*(2*Math.PI/arr.length);
    place(q.emp, CX + Math.cos(a)*470, CY + Math.sin(a)*335,
      {r:15, stroke:q.color, sw:1.5, fill:"#0D1114", name:q.emp, ns:10, op:.35});
  });
  if (emp !== "Maddox")
    place("Maddox", 95, 108, {r:26, fill:"#0B2531", stroke:"#00A1CF", sw:2,
      name:"MADDOX", ns:10, role:"back to the floor"});
  if (showX) drawCross(o);
  if (emp === "Maddox") drawOps();
}

function crossRefs(o){
  const mine = new Set(notesOf(o.dir).map(n=>n.id).concat([o.emp]));
  return GRAPH.links.filter(l=>{
    const s = typeof l.source === "object" ? l.source.id : l.source;
    const t = typeof l.target === "object" ? l.target.id : l.target;
    return l.kind === "ref" && mine.has(s) && !mine.has(t) && nodeById(t);
  });
}
function drawCross(o){
  crossRefs(o).forEach(l=>{
    const s = typeof l.source === "object" ? l.source.id : l.source;
    const t = typeof l.target === "object" ? l.target.id : l.target;
    const sp = nodeEls[s]?._pos, tn = nodeById(t);
    if (!sp || !tn) return;
    const to = byDir[tn.office]; if (!to) return;
    const tp = nodeEls[tn.kind==="employee" ? tn.id : to.emp]?._pos;
    if (!tp) return;
    spoke(sp.x, sp.y, tp.x, tp.y, to.color, .5, "xlink");
  });
}

/* ---------- Maddox's desk: live ops chips ---------- */
let opsEls = [];
function drawOps(){
  clearOps();
  const items = [
    ["leads today", statsCache?.leads_today],
    ["quotes · 7d", statsCache?.quotes_7d],
    ["po's · 7d", statsCache?.pos_7d],
    ["needs input", statsCache?.needs_input],
  ];
  items.forEach((it,i)=>{
    const x = CX - 285 + i*190, y = 752;
    const g = el("g", {class:"g-node"}, gNodes); opsEls.push(g);
    g.style.transform = `translate(${x}px, ${y}px)`;
    const warn = it[0]==="needs input" && it[1] > 0;
    el("rect", {x:-82, y:-23, width:164, height:46, rx:9, fill:"#10151A",
      stroke: warn ? "#E06C5B" : "#1E262D"}, g);
    const v = el("text", {class:"nm", "text-anchor":"middle", y:0, "font-size":15,
      fill: warn ? "#E06C5B" : "#F2F5F7"}, g);
    v.textContent = (it[1] === 0 || it[1]) ? it[1] : "—";
    const k = el("text", {class:"nt", "text-anchor":"middle", y:16}, g);
    k.textContent = it[0];
  });
}
function clearOps(){ opsEls.forEach(e=>e.remove()); opsEls = []; }

/* ---------- interactions ---------- */
function onClick(id, kind){
  if (kind === "note"){ const n = nodeById(id); if (n) window.open(REPO+n.path, "_blank"); return; }
  if (mode === "focus" && id === "Maddox" && focusEmp !== "Maddox"){ layoutHome(); return; }
  if (mode === "focus" && id === focusEmp){ layoutHome(); return; }
  layoutFocus(id);
}
document.getElementById("backlink").onclick = layoutHome;
svg.addEventListener("click", ()=>{ if (mode === "focus") layoutHome(); });
document.addEventListener("keydown", e=>{ if (e.key === "Escape" && mode === "focus") layoutHome(); });
document.getElementById("xbtn").onclick = e=>{ e.stopPropagation();
  showX = !showX; if (mode === "focus") layoutFocus(focusEmp); };

/* ---------- voice hook: window.setSpeaking(true|false) ---------- */
window.setSpeaking = on => document.getElementById("scene").classList.toggle("speaking", !!on);

/* ---------- live status ---------- */
async function stats(){
  const dot = document.getElementById("hubdot"), txt = document.getElementById("hubtxt");
  if (!TOKEN){ dot.className = "dot off"; txt.textContent = "no key"; return; }
  try{
    const r = await fetch(`${HQ_FN}?t=${encodeURIComponent(TOKEN)}&op=stats`);
    if (!r.ok) throw 0;
    statsCache = await r.json();
    dot.className = "dot on"; txt.textContent = "hub live";
    if (mode === "focus" && focusEmp === "Maddox") drawOps();
  }catch(e){ dot.className = "dot off"; txt.textContent = "hub offline"; }
}

/* ---------- idle breathing ---------- */
const t0 = performance.now();
function breathe(now){
  const t = (now - t0) / 1000;
  let i = 0;
  for (const id in nodeEls){
    const p = nodeEls[id]; i++;
    if (!p._pos || (p.g.style.opacity !== "" && +p.g.style.opacity < 0.3)) continue;
    const dy = Math.sin(t*0.65 + i*1.7) * 3.2;
    p.g.style.transform = `translate(${p._pos.x}px, ${p._pos.y + dy}px)`;
  }
  requestAnimationFrame(breathe);
}

/* ---------- boot ---------- */
async function boot(){
  try{
    const r = await fetch(`${BRAIN_FN}?t=${encodeURIComponent(TOKEN)}&op=graph`);
    if (!r.ok) throw 0;
    GRAPH = await r.json();
  }catch(e){
    document.getElementById("hint").textContent = "open this page through your HQ link to load the brain";
  }
  makeNode("Maddox", "center");
  OFFICES.filter(o=>o.emp!=="Maddox").forEach(o=>makeNode(o.emp, "employee"));
  GRAPH.nodes.filter(n=>n.kind==="note").forEach(n=>makeNode(n.id, "note"));
  layoutHome();
  requestAnimationFrame(breathe);
  stats(); setInterval(stats, 60000);
}
boot();
</script>
</body>
</html>
