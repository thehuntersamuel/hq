<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07111d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pitstop Hub">
<title>Pitstop Hub</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="pitstop-hub-app-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:dark;--ink:#eef8ff;--muted:#8ea2b6;--line:rgba(145,190,225,.18);--cyan:#15b9ff;--panel:rgba(8,17,29,.84)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#02060b;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;overflow:hidden;padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));background:radial-gradient(70% 55% at 50% 18%,rgba(0,134,219,.18),transparent 72%),linear-gradient(155deg,#02050a 0%,#07111d 56%,#02050a 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
.shell{position:relative;width:min(460px,100%);padding:38px 34px 32px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(12,27,45,.94),var(--panel));box-shadow:0 34px 110px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.06);text-align:center;backdrop-filter:blur(20px)}
.shell:after{content:"";position:absolute;inset:-1px;border-radius:28px;pointer-events:none;background:linear-gradient(120deg,transparent 20%,rgba(32,190,255,.26),transparent 70%);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;padding:1px}
.mark{width:176px;height:176px;max-width:52vw;max-height:52vw;object-fit:cover;border-radius:28%;filter:drop-shadow(0 14px 32px rgba(0,157,255,.16))}
h1{margin:22px 0 8px;font-size:clamp(25px,7vw,34px);letter-spacing:.04em;line-height:1.05}
h1 span{color:var(--cyan)}
p{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.65;max-width:350px}
button{width:100%;min-height:52px;margin-top:26px;border:1px solid rgba(69,200,255,.52);border-radius:14px;background:linear-gradient(135deg,#16bdff,#0786de);box-shadow:0 14px 34px rgba(0,136,220,.26);color:#001421;font:800 13px/1 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform .18s ease,filter .18s ease}
button:hover{filter:brightness(1.09);transform:translateY(-1px)}button:active{transform:translateY(1px)}
.security{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:#6f879d;font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
.pulse{width:7px;height:7px;border-radius:50%;background:#38d98b;box-shadow:0 0 0 5px rgba(56,217,139,.09)}
@media(max-width:520px){.shell{padding:30px 22px 26px;border-radius:24px}.mark{width:148px;height:148px}button{margin-top:22px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell" aria-labelledby="title">
  <img class="mark" src="pitstop-hub-logo.png" alt="Pitstop Hub sports car mark" width="1254" height="1254">
  <h1 id="title">Pitstop <span>Hub</span></h1>
  <p id="copy">Opening secure account access. This public launcher contains no operational data, session credential, Hub key, or employee login.</p>
  <form id="launch" method="post" action="https://mojjazwjwksypjtljusz.supabase.co/functions/v1/hq?op=entry">
    <input id="ticket" name="ticket" type="hidden" value="">
    <button id="launchbtn" type="submit">Open Secure HQ</button>
  </form>
  <div class="security"><span class="pulse" aria-hidden="true"></span><span id="sub">Secure Post Entry · Account Session</span></div>
</main>
<script>
(function(){
  const form=document.getElementById('launch');
  const btn=document.getElementById('launchbtn');
  const title=document.getElementById('title');
  const copy=document.getElementById('copy');
  const sub=document.getElementById('sub');
  const ticket=new URLSearchParams(location.search).get('setup')||'';
  if(ticket){
    form.action='https://mojjazwjwksypjtljusz.supabase.co/functions/v1/hq?op=bootstrap';
    document.getElementById('ticket').value=ticket;
    title.innerHTML='Owner <span>Setup</span>';
    copy.textContent='Create the first individual owner account. This one-time proof is submitted securely and is never stored in the public launcher.';
    btn.textContent='Create Owner Account';
    sub.textContent='One-Time Enrollment · Secure Post';
    return;
  }
  setTimeout(()=>form.requestSubmit(),180);
})();
</script>
</body>
</html>
