<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitstop Brain</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,500;0,600;1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0A0B0D; --panel:#12151A; --line:#20252C;
    --ink:#EDF1F4; --ink2:#97A1AC; --ink3:#59626C;
    --steel:#3A434E; --steel2:#262C34;
    --acc:#00A1CF; --acc2:#1CA5DB; --acc3:#4FC1E9;
    --alert:#E8453C; --ok:#2FBF71; --warm:#E8B23A; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,'Cascadia Mono','SF Mono',Consolas,monospace}
  body{background:
    radial-gradient(900px 620px at 78% 10%, rgba(79,193,233,.06), transparent 55%),
    radial-gradient(1000px 700px at 12% 90%, rgba(0,161,207,.08), transparent 58%),
    radial-gradient(1000px 660px at 50% 44%, rgba(0,161,207,.05), transparent 62%),
    repeating-linear-gradient(45deg, #0A0B0D 0 3px, #0C0E11 3px 6px);}

  header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:baseline;
    gap:14px;padding:16px 22px;pointer-events:none}
  .wm{font-family:'Oswald',sans-serif;font-style:italic;font-size:17px;font-weight:600;
    letter-spacing:.24em;color:var(--ink)}
  .wm b{color:var(--acc2);font-weight:600}
  .sysline{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.18em;
    color:var(--ink3)}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;
    font-family:ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.16em;color:var(--ink3)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(47,191,113,.6)}

  #stage{position:fixed;inset:0}
  svg{width:100%;height:100%;display:block}
  .nd{cursor:pointer}
  .nd circle.body{transition:r .5s cubic-bezier(.22,.8,.36,1), fill .3s, stroke .3s}
  .nd:hover circle.body{stroke:var(--acc);filter:drop-shadow(0 0 10px rgba(0,161,207,.5))}
  .nd:hover .weavewrap{filter:drop-shadow(0 0 12px rgba(0,161,207,.35))}
  .nd:hover .idot{fill:var(--acc)}
  .nd text{pointer-events:none;user-select:none}
  .nm{font-family:'Oswald',sans-serif;font-style:italic;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;fill:var(--ink)}
  .rl{fill:var(--ink3);font-size:9px;font-family:ui-monospace,Consolas,monospace;letter-spacing:.16em}
  .nt{fill:var(--ink2);font-size:11.5px;font-family:'Inter',sans-serif}
  .g-node{transition:transform .55s cubic-bezier(.22,.8,.36,1), opacity .45s}
  .spoke,.xlink{transition:opacity .45s}
  .xlink{stroke-dasharray:3 6;stroke:var(--acc);opacity:.5}

  @keyframes pulse{0%{transform:scale(1);opacity:.5}70%{transform:scale(1.32);opacity:0}100%{transform:scale(1.32);opacity:0}}
  .halo,.halo2{transform-origin:center;transform-box:fill-box;animation:pulse 3.4s ease-out infinite}
  .halo2{animation-delay:1.15s}
  @keyframes spinCW{to{transform:rotate(360deg)}}
  @keyframes spinCCW{to{transform:rotate(-360deg)}}
  .ring-a{transform-origin:center;transform-box:fill-box;animation:spinCW 26s linear infinite}
  .ring-b{transform-origin:center;transform-box:fill-box;animation:spinCCW 40s linear infinite}
  .orbit{transform-origin:center;transform-box:fill-box;animation:spinCW 9s linear infinite}

  .hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;
    font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.16em;
    color:var(--ink3);pointer-events:none;transition:opacity .4s;text-transform:uppercase}
  .ctl{position:fixed;bottom:16px;right:18px;z-index:10}
  .ctl button{background:var(--panel);border:1px solid var(--line);color:var(--ink2);
    font:10px ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;
    padding:9px 14px;cursor:pointer;transition:all .2s;
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px)}
  .ctl button:hover{color:var(--ink);border-color:var(--acc)}
  .ctl button.on{background:var(--acc);border-color:var(--acc);color:#03222C;font-weight:600}
  .crumb{position:fixed;bottom:16px;left:18px;z-index:10;
    font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;transition:opacity .4s}
  .crumb a{color:var(--ink2);text-decoration:none;cursor:pointer}
  .crumb a:hover{color:var(--acc3)}

  #drawer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:26px;background:rgba(5,7,9,.66);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .3s}
  #drawer.open{opacity:1;pointer-events:auto}
  .panel-box{position:relative;width:min(880px,100%);max-height:min(780px,92dvh);padding:34px 40px 40px;
    overflow-y:auto;border:1px solid var(--line);background:rgba(14,17,21,.97);
    clip-path:polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    transform:translateY(10px);transition:transform .3s}
  #drawer.open .panel-box{transform:none}
  .panel-box .edge{position:absolute;top:0;left:0;width:3px;height:100%;background:var(--noteC,var(--acc));opacity:.8}
  #drawer .close{position:absolute;top:12px;right:16px;background:none;border:none;
    color:var(--ink3);font-size:22px;cursor:pointer;z-index:2}
  #drawer .close:hover{color:var(--ink)}

  .mdoc{font-size:13px;line-height:1.75;color:var(--ink2)}
  .mdoc h1,.mdoc h2,.mdoc h3,.mdoc h4{font-family:'Oswald',sans-serif;font-style:italic;font-weight:600;
    text-transform:uppercase;color:var(--ink);line-height:1.3;margin:26px 0 10px}
  .mdoc h1{font-size:19px;letter-spacing:.08em}
  .mdoc h2{font-size:15px;letter-spacing:.1em;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .mdoc h3,.mdoc h4{font-size:12.5px;letter-spacing:.14em;color:var(--ink2)}
  .mdoc>*:first-child{margin-top:0}
  .mdoc p{margin:0 0 13px}
  .mdoc ul,.mdoc ol{margin:0 0 14px;padding-left:20px}
  .mdoc li{margin:4px 0}
  .mdoc strong{color:var(--ink);font-weight:600}
  .mdoc em{color:var(--ink)}
  .mdoc code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:#1A2027;
    border:1px solid var(--line);padding:1px 5px;border-radius:3px;color:var(--acc3)}
  .mdoc pre{background:#0D1116;border:1px solid var(--line);padding:12px 14px;overflow-x:auto;margin:0 0 14px}
  .mdoc pre code{background:none;border:none;padding:0;color:var(--ink2)}
  .mdoc blockquote{border-left:2px solid var(--noteC,var(--acc));margin:0 0 13px;padding:2px 0 2px 14px;color:var(--ink3)}
  .mdoc hr{border:none;border-top:1px solid var(--line);margin:20px 0}
  .mdoc table{width:100%;border-collapse:collapse;margin:4px 0 16px}
  .mdoc th{font-family:ui-monospace,Consolas,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink3);text-align:left;padding:6px 12px 6px 0;border-bottom:1px solid var(--steel)}
  .mdoc td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2);vertical-align:top}
  .mdoc td:first-child{color:var(--ink)}
  .mdoc a{color:var(--acc3);text-decoration:none}
  .mdoc a:hover{text-decoration:underline}
  .mdoc .wl{color:var(--acc3);cursor:pointer;border-bottom:1px dashed rgba(79,193,233,.4)}
  .mdoc .wl:hover{border-bottom-style:solid}
  .mdoc input[type=checkbox]{accent-color:var(--acc);margin-right:6px}

  #composer{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:12;
    display:none;align-items:center;gap:8px;width:min(600px,92vw)}
  #composer.on{display:flex}
  #composer input{flex:1;min-width:0;background:rgba(18,21,26,.92);border:1px solid var(--line);color:var(--ink);
    font:12px ui-monospace,Consolas,monospace;letter-spacing:.04em;padding:12px 14px;outline:none;
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px)}
  #composer input:focus{border-color:var(--acc)}
  #composer input::placeholder{color:var(--ink3);letter-spacing:.1em;font-size:10.5px}
  #composer button{background:var(--acc);border:1px solid var(--acc);color:#03222C;
    font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.14em;padding:13px 18px;cursor:pointer;
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px)}
  #composer button:disabled{opacity:.5;cursor:default}
  #composer button:hover:not(:disabled){background:var(--acc2);border-color:var(--acc2)}
  #msgok{position:fixed;left:50%;transform:translateX(-50%);bottom:66px;z-index:12;text-align:center;
    font:10px ui-monospace,Consolas,monospace;letter-spacing:.18em;color:var(--ok);opacity:0;
    transition:opacity .4s;pointer-events:none}
  #d-office{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
  #d-title{font-family:'Oswald',sans-serif;font-style:italic;font-size:27px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;line-height:1.25;margin-bottom:13px}
  .chip-status{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:9.5px;
    font-weight:600;letter-spacing:.16em;padding:5px 12px;margin-bottom:18px;
    clip-path:polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px)}
  .st-LIVE{background:rgba(47,191,113,.13);color:var(--ok);border:1px solid rgba(47,191,113,.45)}
  .st-RULE{background:rgba(0,161,207,.12);color:var(--acc3);border:1px solid rgba(0,161,207,.45)}
  .st-ANALYSIS{background:rgba(232,178,58,.12);color:var(--warm);border:1px solid rgba(232,178,58,.45)}
  .st-RECORD{background:rgba(151,161,172,.1);color:var(--ink2);border:1px solid rgba(151,161,172,.35)}
  .st-ROADMAP{background:rgba(79,193,233,.1);color:var(--acc3);border:1px solid rgba(79,193,233,.4)}
  .st-INBOX{background:rgba(0,161,207,.12);color:var(--acc3);border:1px solid rgba(0,161,207,.45)}
  #d-sum{font-size:14px;line-height:1.65;color:var(--ink);margin-bottom:20px}
  #d-body{font-size:12.5px;line-height:1.7;color:var(--ink2);border-top:1px solid var(--line);padding-top:16px}
  #d-body .lbl{font-family:ui-monospace,Consolas,monospace;font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
  
  .side{position:fixed;top:50%;transform:translateY(-50%);width:236px;z-index:8;
    transition:opacity .4s}
  .side.left{left:26px} .side.right{right:26px}
  .side-hd{font-family:ui-monospace,Consolas,monospace;font-size:9px;letter-spacing:.24em;
    color:var(--ink3);margin-bottom:10px;padding-left:2px}
  .scard{border:1px solid var(--line);background:rgba(18,21,26,.82);padding:18px 18px 16px;
    min-height:118px;position:relative;
    clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px)}
  .scard::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;
    background:var(--cardc,var(--acc));opacity:.7}
  .scard .k{color:var(--cardc,var(--ink3)) !important;opacity:.95}
  .srows{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .srow{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
  .srow b{font-family:ui-monospace,Consolas,monospace;font-size:8.5px;letter-spacing:.16em;
    color:var(--ink3);font-weight:400;text-transform:uppercase}
  .srow span{font-family:'Oswald',sans-serif;font-style:italic;font-size:13px;
    letter-spacing:.06em;color:var(--ink)}
  .scard2{margin-top:14px;min-height:0}
  .scard .k{font-family:ui-monospace,Consolas,monospace;font-size:9px;letter-spacing:.18em;
    color:var(--ink3);text-transform:uppercase;margin-bottom:9px}
  .scard .v{font-family:'Oswald',sans-serif;font-style:italic;font-size:27px;font-weight:600;
    letter-spacing:.04em;color:var(--ink);line-height:1.1;margin-bottom:6px}
  .scard .m{font-size:11px;color:var(--ink2);line-height:1.5}
  .scard.fade{animation:cardIn .5s ease}
  @keyframes cardIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .side.right .scard.fade{animation:cardInR .5s ease}
  @keyframes cardInR{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
  .sdots{display:flex;gap:5px;margin-top:9px;padding-left:2px}
  .sdots i{width:10px;height:2px;background:var(--steel2)}
  .sdots i.on{background:var(--acc)}
  body.drawer-open .side.right{opacity:0;pointer-events:none}
  @media(min-width:761px) and (max-width:1180px) and (min-height:481px){.side{display:none}}

  @media(max-width:760px),(max-height:480px){
    html,body{overflow-y:auto;overflow-x:hidden;height:auto}
    body{min-height:100dvh;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
    header{padding:12px 14px;background:linear-gradient(#0A0B0D 62%,rgba(10,11,13,0))}
    .sysline{display:none}
    #stage{position:relative;inset:auto;height:58vh;min-height:340px;margin-top:44px}
    .hint{position:static;margin:0 0 6px;height:14px}
    .side{position:static;transform:none;width:auto;display:block;padding:0 12px}
    .side.left{margin-top:2px}
    .side.right{margin-top:16px;margin-bottom:8px}
    .scard{min-height:0}
    body.drawer-open .side.right{opacity:1;pointer-events:auto}
    .crumb{display:none}
    .ctl{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:10px}
    #composer{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100vw - 16px)}
    #composer input{font-size:16px;padding:11px 12px}
    #msgok{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
    #drawer{padding:10px}
    .panel-box{padding:24px 20px 30px;max-height:94dvh}
  }

</style>
</head>

<defs>

</svg></div>

<div class="side left" id="sideL">

<div class="hint" id="hint">select a branch</div>
<div class="crumb" id="crumb" style="opacity:0"><a id="backlink">&larr; return to grid</a></div>
<div class="ctl"><button id="xbtn" style="display:none">show connections</button></div>

<div id="drawer"><div class="panel-box" id="pbox"><span class="edge"></span>
  <button class="close" id="dclose">&times;</button>
  <div id="d-office"></div>
  <div id="d-title"></div>

function place(id, x, y, o){

    p.weave.R = o.r;
    p.weave.wrap.style.opacity = (o.op ?? 1) < 1 ? .75 : 1;
  }
  if (p.kind !== "center" && p.kind !== "employee"){
    
    p.body.setAttribute("r", o.r);
    p.body.setAttribute("fill", o.fill || "var(--panel)");
    p.body.setAttribute("stroke", o.active ? "var(--acc)" : "var(--steel)");
    p.body.setAttribute("stroke-width", o.active ? 2 : 1.5);
    if (o.active) p.body.style.filter = "drop-shadow(0 0 14px rgba(0,161,207,.4))";
    else p.body.style.filter = "";
    if (p.idot){ p.idot.setAttribute("fill", o.oc || (o.active ? "var(--acc)" : "var(--steel)"));
      p.idot.style.display = o.hideDot ? "none" : ""; }
    if (p.arc){
      if (o.oc && !o.active){
        const C = 2 * Math.PI * o.r;

        p.arc.setAttribute("stroke-dasharray", (C * 0.16) + " " + (C * 0.84));
        p.arc.style.display = ""; p.arc.style.opacity = ".85";

  p._r = o.r; p._breath = (o.r >= 14 && o.r <= 40 && !o.orb);
  const lines = o.lines || [];
  const baseY = o.nameIn ? 6 : o.r + 22;
  p.name.textContent = lines[0] || "";

}

function crossRefs(o){

    const s = typeof l.source === "object" ? l.source.id : l.source;

    return l.kind === "ref" && mine.has(s) && !mine.has(t) && nodeById(t);
  });

function drawCross(o){

function escH(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inline(s){
  s = s.replace(/`([^`]+)`/g, (m,c)=>"<code>"+c+"</code>");
  s = s.replace(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g,
    (m,c)=>'<span class="wl" data-wl="'+c.trim()+'">'+titleCase(c.trim())+'</span>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,:;!?]|$)/g, "$1<em>$2</em>");
  return s;
}
function renderMD(md){
  const lines = md.replace(/\r/g, "").split("\n");
  let out = [], i = 0, para = [];
  const flush = ()=>{ if (para.length){ out.push("<p>"+inline(escH(para.join(" ")))+"</p>"); para = []; } };
  while (i < lines.length){
    const L = lines[i];
    if (/^\s*$/.test(L)){ flush(); i++; continue; }
    const hm = L.match(/^(#{1,4})\s+(.*)$/);
    if (hm){ flush(); out.push("<h"+hm[1].length+">"+inline(escH(hm[2]))+"</h"+hm[1].length+">"); i++; continue; }
    if (/^---+\s*$/.test(L)){ flush(); out.push("<hr>"); i++; continue; }
    if (/^>/.test(L)){ flush(); const q = [];
      while (i < lines.length && /^>/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/, "")); i++; }
      out.push("<blockquote>"+inline(escH(q.join(" ")))+"</blockquote>"); continue; }
    if (/^```/.test(L)){ flush(); const c = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])){ c.push(lines[i]); i++; }
      i++; out.push("<pre><code>"+escH(c.join("\n"))+"</code></pre>"); continue; }
    if (/^\|.*\|\s*$/.test(L)){ flush(); const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
      const sep = r => /^\|[\s:|-]+\|\s*$/.test(r);
      const cells = r => r.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(c=>inline(escH(c.trim())));
      let t = "<table>", body = rows;
      if (rows.length > 1 && sep(rows[1])){
        t += "<tr>"+cells(rows[0]).map(c=>"<th>"+c+"</th>").join("")+"</tr>"; body = rows.slice(2);
      }
      body.forEach(r=>{ if (!sep(r)) t += "<tr>"+cells(r).map(c=>"<td>"+c+"</td>").join("")+"</tr>"; });
      out.push(t+"</table>"); continue; }
    if (/^\s*(?:[-*]|\d+[.)])\s+/.test(L)){ flush(); const ol = /^\s*\d/.test(L); const items = [];
      while (i < lines.length && (/^\s*(?:[-*]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))){
        if (/^\s*(?:[-*]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*(?:[-*]|\d+[.)])\s+/, ""));
        else items[items.length-1] += " " + lines[i].trim();
        i++;
      }
      const tag = ol ? "ol" : "ul";
      out.push("<"+tag+">"+items.map(x=>{
        let cb = "";
        const cm = x.match(/^\[( |x|X)\]\s/);
        if (cm){ cb = '<input type="checkbox" disabled'+(/x/i.test(cm[1]) ? " checked" : "")+'>'; x = x.slice(cm[0].length); }
        return "<li>"+cb+inline(escH(x))+"</li>";
      }).join("")+"</"+tag+">"); continue; }
    para.push(L.trim()); i++;
  }
  flush();
  return out.join("");
}

let th3 = 0;
function proj(p){
  const ct = Math.cos(th3), st = Math.sin(th3);
  const x = p[0]*ct + p[2]*st, z = -p[0]*st + p[2]*ct;
  const s = 620 / (620 - z*0.6);
  return [600 + x*s, 410 + p[1]*s, s, z];
}
let tOrb = 0, frameNo = 0;
function tick3d(){
  th3 += 0.0016; tOrb += 0.016;
  if ((frameNo = (frameNo + 1) % 2) === 0){
    for (const key in ORBS) updateWeave(ORBS[key], tOrb);
  }
  let bi = 0;
  for (const id in nodeEls){
    const p = nodeEls[id]; bi++;
    if (p._breath && p.body && p.body.style.display !== "none")
      p.body.setAttribute("r", p._r + Math.sin(tOrb * 0.9 + bi * 1.9) * 0.55);
  }
  P3.forEach(([n,c])=>{ const q = proj(n._p3);
    c.setAttribute("cx", q[0]); c.setAttribute("cy", q[1]);
    c.setAttribute("opacity", 0.25 + 0.55*(q[3]+320)/640); });
  L3.forEach(([s,t,ln])=>{ const a1 = proj(s._p3), b1 = proj(t._p3);
    ln.setAttribute("x1", a1[0]); ln.setAttribute("y1", a1[1]);
    ln.setAttribute("x2", b1[0]); ln.setAttribute("y2", b1[1]);
    ln.setAttribute("opacity", 0.15 + 0.3*((a1[3]+b1[3])/2+320)/640); });
  requestAnimationFrame(tick3d);
}

const panelState = {L:{list:FEED, i:0}, R:{list:VITALS, i:0}};
function cardHTML(d){
  const vsz = (d.v||"").length > 11 ? ' style="font-size:18px;letter-spacing:.06em;word-break:break-all"' : '';
  let s = '<div class="k">'+d.k+'</div>';
  if (d.v) s += '<div class="v"'+vsz+'>'+d.v+'</div>';
  if (d.m) s += '<div class="m">'+d.m+'</div>';
  if (d.rows && d.rows.length)
    s += '<div class="srows">'+d.rows.map(r=>'<div class="srow"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>').join("")+'</div>';
  return s;
}
function paintCard(elc, d){
  elc.style.setProperty("--cardc", d.c || "#00A1CF");
  elc.innerHTML = cardHTML(d);
}
function renderCard(side){
  const st = panelState[side];
  const card = document.getElementById("side"+side+"-card");
  const d = st.list[st.i % st.list.length];
  card.classList.remove("fade"); void card.offsetWidth;
  paintCard(card, d);
  card.classList.add("fade");
  const dots = document.getElementById("side"+side+"-dots");
  dots.innerHTML = st.list.map((_,j)=>'<i class="'+(j===st.i%st.list.length?"on":"")+'"></i>').join("");
}

function setPanels(feedList, vitalsList, hdL, hdR){
  panelState.L = {list:feedList, i:0}; panelState.R = {list:vitalsList, i:0};
  document.getElementById("sideL-hd").textContent = hdL;
  document.getElementById("sideR-hd").textContent = hdR;
  renderCard("L"); renderCard("R");
}
paintCard(document.getElementById("sideL-card2"), SYS_CARD);
paintCard(document.getElementById("sideR-card2"), TARGET_CARD);
async function liveStats(){
  const dot = document.querySelector(".status .dot"), txt = document.querySelector(".status span:last-child");
  if (!TOKEN){ if (dot) dot.style.background = "var(--alert)"; if (txt) txt.textContent = "NO.KEY"; return; }
  try{
    const r = await fetch(`${HQ_FN}?t=${encodeURIComponent(TOKEN)}&op=stats`);
    if (!r.ok) throw 0;
    const s = await r.json();
    if (dot) dot.style.background = "var(--ok)"; if (txt) txt.textContent = "HUB.LIVE";
    VITALS[2].v = String(s.pos_7d ?? "—");
    SYS_CARD.rows = [["HUB","ONLINE"],["WORKERS","2 LIVE"],["LEADS TODAY", String(s.leads_today ?? 0)],
      ["BRAIN", BRAINN],["NEEDS.INPUT", String(s.needs_input ?? 0)]];
    OFFICE_VITALS.Duke[0].v = (s.pos_7d ?? 4) + " PO'S";
    paintCard(document.getElementById("sideL-card2"), SYS_CARD);
    renderCard("R");
  }catch(e){ if (dot) dot.style.background = "var(--alert)"; if (txt) txt.textContent = "HUB.OFFLINE"; }
}
liveStats(); setInterval(liveStats, 60000);

async function liveGraph(){
  if (!TOKEN) return;
  try{
    const r = await fetch(`${BRAIN_FN}?t=${encodeURIComponent(TOKEN)}&op=graph`);
    if (!r.ok) throw 0;
    const g2 = await r.json();
    if (g2 && g2.nodes && g2.nodes.length){
      g2.nodes.filter(n=>n.kind==="note" && !nodeEls[n.id]).forEach(n=>{ GRAPH.nodes.push(n); makeNode(n.id, "note"); });
      GRAPH.links = g2.links;
      if (mode === "home") layoutHome(); else layoutFocus(focusEmp);
    }
  }catch(e){}
}
liveGraph();

let BRAINN = "29 FILES";
if (TOKEN) fetch(`${BRAIN_FN}?t=${encodeURIComponent(TOKEN)}`).then(r=>r.json()).then(m=>{
  if (!m || !m.files) return;
  BRAINN = m.files + " FILES";
  SYS_CARD.rows = SYS_CARD.rows.map(r=>r[0] === "BRAIN" ? ["BRAIN", BRAINN] : r);
  OFFICE_VITALS.Maddox[0].v = BRAINN; FEED[3].v = BRAINN;
  paintCard(document.getElementById("sideL-card2"), SYS_CARD);
}).catch(()=>{});

let FILES_CACHE = null;
async function noteContent(path){
  if (!TOKEN) return null;
  if (!FILES_CACHE){
    try{
      const r = await fetch(`${BRAIN_FN}?t=${encodeURIComponent(TOKEN)}&op=files`);
      if (!r.ok) throw 0;
      const arr = await r.json();
      FILES_CACHE = {};
      arr.forEach(f=>FILES_CACHE[f.path] = f.content);
    }catch(e){ return null; }
  }
  let c = FILES_CACHE[path] || null;
  if (c){
    c = c.replace(/^---[\s\S]*?---\n/, "");
    c = c.replace(/^> Office:.*$/m, "").trim();
  }
  return c;
}
const INBOX_PATH = emp => byEmp[emp].dir + "/" + emp.toLowerCase() + "_inbox.md";
const INBOX_TPL = emp => "---\nname: " + emp.toLowerCase() + "-inbox\noffice: " + byEmp[emp].dir +
  "\nowner: " + emp + "\ntype: inbox\n---\n\n# " + emp + " Inbox\n\nMessages from Hunter land here. " +
  emp + " reads this desk before every run.\n";
let okT;
function flashOK(t, bad){
  const el = document.getElementById("msgok");
  el.textContent = t; el.style.color = bad ? "var(--alert)" : "var(--ok)";
  el.style.opacity = 1; clearTimeout(okT); okT = setTimeout(()=>el.style.opacity = 0, 2800);
}
async function sendMsg(){
  const inp = document.getElementById("msgin"), btn = document.getElementById("msgbtn");
  const emp = focusEmp, text = inp.value.trim();
  if (!emp || !text) return;
  if (!TOKEN){ flashOK("NO KEY IN THIS LINK", true); return; }
  btn.disabled = true; btn.textContent = "…";
  try{
    if (!FILES_CACHE) await noteContent("__warm__");
    if (!FILES_CACHE) throw 0;
    const path = INBOX_PATH(emp);
    const base = FILES_CACHE[path] || INBOX_TPL(emp);
    const stamp = new Date().toLocaleString("en-US", {month:"2-digit", day:"2-digit", hour:"numeric", minute:"2-digit"});
    const next = base.replace(/\s*$/, "") + "\n\n- **" + stamp + "** · " + text + "\n";
    const r = await fetch(BRAIN_FN + "?t=" + encodeURIComponent(TOKEN) + "&op=put",
      {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({path, content:next})});
    if (!r.ok) throw 0;
    FILES_CACHE[path] = next;
    inp.value = "";
    flashOK("LOGGED TO " + emp.toUpperCase() + "'S DESK");
    liveGraph();
  }catch(e){ flashOK("SEND FAILED · TRY AGAIN", true); }
  btn.disabled = false; btn.textContent = "SEND";
}
document.getElementById("msgbtn").onclick = sendMsg;
document.getElementById("msgin").addEventListener("keydown", e=>{
  if (e.key === "Enter") sendMsg();
  e.stopPropagation();
});
function fitScene(){
  const r = document.getElementById("stage").getBoundingClientRect();
  const portrait = (r.width || innerWidth) / (r.height || innerHeight) < .92;
  svg.setAttribute("viewBox", portrait ? "150 -20 900 880" : "0 0 1200 820");
}
fitScene(); addEventListener("resize", fitScene);
setTimeout(fitScene, 60);
setInterval(()=>{ panelState.L.i++; renderCard("L"); }, 6200);
setInterval(()=>{ panelState.R.i++; renderCard("R"); }, 7400);

const _layoutHome = layoutHome;
layoutHome = function(){ _layoutHome();
  document.getElementById("composer").classList.remove("on");
  setPanels(FEED, VITALS, "FLOOR.FEED", "VITALS"); };
const _layoutFocus = layoutFocus;
layoutFocus = function(emp){ _layoutFocus(emp);
  const cm = document.getElementById("composer");
  cm.classList.add("on");
  document.getElementById("msgin").placeholder = "TYPE TO " + emp.toUpperCase() + " · FEEDBACK, TASKS, ANYTHING";
  const ov = oc(OFFICE_VITALS[emp] || [{k:emp.toUpperCase()+" // STATUS", v:"SOON", m:"Reporting hookup pending for this office."}], emp);
  setPanels(ov, VITALS, emp.toUpperCase()+".VITALS", "VITALS"); };

makeNode("Maddox", "center");
OFFICES.filter(o=>o.emp!=="Maddox").forEach(o=>makeNode(o.emp, "employee"));
GRAPH.nodes.filter(n=>n.kind==="note").forEach(n=>makeNode(n.id, "note"));
layoutHome();
setPanels(FEED, VITALS, "FLOOR.FEED", "VITALS");
</script>
